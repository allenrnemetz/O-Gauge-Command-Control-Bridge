[tool.ruff.lint]
# G004: logging-f-string — f-strings in logger calls are intentional for
# readability; the bridge is not a high-throughput logging workload.
#
# BLE001: blind-except — `except Exception:` is intentional throughout for
# best-effort cleanup (serial close, socket close, etc.) where any failure
# should be swallowed, not crash the bridge.
#
# S110: try-except-pass — used in cleanup/finalizer code where logging the
# exception adds noise without value (e.g. closing a socket that may already
# be closed).
#
# SIM102: collapsible-if — nested ifs are sometimes more readable than a
# single combined condition, especially when each has its own comment.
#
# RUF034: useless-if-else — flagged on a test function with corrupted emoji;
# cosmetic, not a runtime issue.
ignore = ["G004", "BLE001", "S110", "SIM102", "RUF034"]

[tool.pyright]
# Relax type checking for this codebase — many patterns (Optional socket
# members, dynamic attributes) are intentional and guarded at runtime.
typeCheckingMode = "basic"
# bytearray is assignable to bytes at runtime; allow it in type checks too.
disableBytesTypePromotions = false
# Home Assistant is not installed in the bridge dev environment, so suppress
# missing import diagnostics for the custom_component files.
reportMissingImports = "none"
# The Home Assistant ConfigFlow base class uses __init_subclass__ arguments
# (e.g., domain=...) that Pyright cannot resolve without HA stubs installed.
reportGeneralTypeIssues = "none"
reportCallIssue = "none"
# Home Assistant type stubs are not installed locally; suppress call/argument
# type diagnostics that depend on them.
reportArgumentType = "none"

[tool.pylint."messages control"]
# Same as .pylintrc — disabled categories for this codebase.
disable = ["W1203", "W0718", "W0719", "W0212", "W0613", "W0707", "C", "R"]

[tool.pylint.typecheck]
# Same as .pylintrc — these optional runtime deps are not installed locally.
ignored-modules = ["homeassistant", "rpi_ws281x"]
