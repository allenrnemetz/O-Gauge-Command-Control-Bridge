<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#1e3a5f"/>
  
  <!-- Bridge structure -->
  <g fill="#4a90d9">
    <!-- Bridge deck -->
    <rect x="28" y="120" width="200" height="12" rx="2"/>
    <!-- Bridge towers -->
    <rect x="48" y="80" width="10" height="52"/>
    <rect x="118" y="70" width="10" height="62"/>
    <rect x="198" y="80" width="10" height="52"/>
    <!-- Bridge cables (suspension style) -->
    <line x1="53" y1="80" x2="78" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <line x1="53" y1="80" x2="68" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <line x1="123" y1="70" x2="100" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <line x1="123" y1="70" x2="148" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <line x1="203" y1="80" x2="178" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <line x1="203" y1="80" x2="188" y2="120" stroke="#4a90d9" stroke-width="3"/>
    <!-- Tower tops -->
    <rect x="44" y="74" width="18" height="8" rx="2"/>
    <rect x="114" y="64" width="18" height="8" rx="2"/>
    <rect x="194" y="74" width="18" height="8" rx="2"/>
  </g>
  
  <!-- Train on bridge -->
  <g fill="#f0a030">
    <!-- Train body -->
    <rect x="88" y="138" width="80" height="28" rx="4"/>
    <!-- Cab -->
    <rect x="88" y="128" width="22" height="14" rx="2"/>
    <!-- Smokestack -->
    <rect x="150" y="122" width="8" height="14" rx="2"/>
    <!-- Window -->
    <rect x="92" y="132" width="14" height="8" fill="#1e3a5f"/>
    <!-- Front light -->
    <circle cx="170" cy="152" r="4" fill="#ffeb3b"/>
  </g>
  
  <!-- Train wheels -->
  <g fill="#333">
    <circle cx="100" cy="172" r="7"/>
    <circle cx="120" cy="172" r="7"/>
    <circle cx="140" cy="172" r="7"/>
    <circle cx="160" cy="172" r="7"/>
  </g>
  
  <!-- Track -->
  <rect x="28" y="166" width="200" height="4" fill="#666"/>
  <rect x="28" y="180" width="200" height="4" fill="#666"/>
</svg>
